<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻标题里的她 — 媒介素养测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --ink-muted: #5a5048;
    --ink-faint: #9a8f85;
    --paper: #faf8f4;
    --paper-warm: #f2ede5;
    --paper-card: #ffffff;
    --accent: #8b2635;
    --accent-soft: #f5e8ea;
    --accent-mid: #c4687a;
    --gold: #b8860b;
    --gold-soft: #fdf6e3;
    --ok: #2d6a4f;
    --ok-soft: #e8f5ee;
    --border: rgba(26,20,16,0.12);
    --border-strong: rgba(26,20,16,0.25);
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }

  /* SCREENS */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== INTRO ===== */
  #intro {
    background: var(--paper);
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }
  .intro-wrap { max-width: 680px; width: 100%; text-align: center; }
  .intro-eyebrow {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 32px;
  }
  .intro-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(32px, 6vw, 54px);
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .intro-title em { color: var(--accent); font-style: normal; }
  .intro-divider {
    width: 60px; height: 2px;
    background: var(--accent);
    margin: 0 auto 32px;
  }
  .intro-desc {
    font-size: 16px;
    color: var(--ink-muted);
    max-width: 520px;
    margin: 0 auto 48px;
    line-height: 1.9;
  }
  .intro-meta {
    display: flex;
    gap: 32px;
    justify-content: center;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }
  .intro-meta-item {
    text-align: center;
  }
  .intro-meta-num {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }
  .intro-meta-label {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }
  .btn-start {
    display: inline-block;
    padding: 16px 48px;
    background: var(--accent);
    color: #fff;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.05em;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-start:hover { background: #6e1d28; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }
  .intro-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ===== QUIZ ===== */
  #quiz {
    background: var(--paper);
    padding: 0;
    align-items: stretch;
  }
  .quiz-header {
    background: var(--paper-warm);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .quiz-header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    color: var(--ink-muted);
  }
  .quiz-progress-wrap { flex: 1; max-width: 300px; margin: 0 32px; }
  .quiz-progress-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .quiz-progress-text {
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px 80px;
  }
  .quiz-card {
    max-width: 740px;
    width: 100%;
  }
  .quiz-q-label {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    font-family: 'Playfair Display', serif;
  }
  .quiz-q-task {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .quiz-q-sub {
    font-size: 14px;
    color: var(--ink-faint);
    margin-bottom: 24px;
  }

  /* News article card */
  .news-card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 32px;
    position: relative;
  }
  .news-card-source {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .news-card-source::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent-mid);
    border-radius: 50%;
  }
  .news-card-body {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.8;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 12px;
  }
  
  .news-card-body::-webkit-scrollbar { width: 6px; }
  .news-card-body::-webkit-scrollbar-track { background: var(--paper); border-radius: 4px; }
  .news-card-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  /* Options */
  .options-label {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    background: var(--paper-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    line-height: 1.6;
    position: relative;
  }
  .option-btn:hover {
    border-color: var(--ink-muted);
    transform: translateY(-1px);
  }
  .option-btn.selected {
    border-color: var(--ink);
    background: var(--paper-warm);
    font-weight: 600;
  }
  .option-letter {
    display: inline-block;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid currentColor;
    text-align: center;
    line-height: 20px;
    font-size: 12px;
    font-weight: 500;
    margin-right: 12px;
    flex-shrink: 0;
    vertical-align: middle;
  }

  /* Navigation Buttons */
  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }
  .btn-nav {
    padding: 12px 28px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn-prev {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--ink-muted);
  }
  .btn-prev:hover { background: var(--paper-card); color: var(--ink); }
  .btn-prev.hidden { visibility: hidden; }
  
  .btn-next {
    background: var(--ink);
    border: 1px solid var(--ink);
    color: #fff;
  }
  .btn-next:hover:not(:disabled) { background: #333; }
  .btn-next:disabled { background: var(--border-strong); border-color: transparent; cursor: not-allowed; opacity: 0.6; }

  /* ===== RESULTS ===== */
  #results {
    background: var(--paper);
    align-items: center;
    justify-content: flex-start;
    padding: 60px 24px 80px;
  }
  .results-wrap { max-width: 760px; width: 100%; margin: 0 auto; }
  .results-eyebrow {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 12px;
  }
  .results-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 700;
    text-align: center;
    color: var(--ink);
    margin-bottom: 40px;
    line-height: 1.4;
  }

  .score-ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }
  .score-ring-svg { width: 160px; height: 160px; }
  .score-ring-num {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    fill: var(--ink);
  }
  .score-ring-label {
    font-size: 11px;
    fill: var(--ink-faint);
    font-family: 'Noto Sans SC', sans-serif;
  }

  .literacy-bar-section {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    margin-bottom: 32px;
    text-align: center;
  }
  .literacy-bar-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .literacy-bar-desc {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .literacy-spectrum {
    position: relative;
    height: 12px;
    background: linear-gradient(to right, var(--ok), #f0c040, var(--accent));
    border-radius: 6px;
    margin: 0 auto 12px;
    max-width: 480px;
  }
  .literacy-marker {
    position: absolute;
    top: -6px;
    width: 24px; height: 24px;
    background: var(--ink);
    border: 3px solid #fff;
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: left 1s cubic-bezier(0.34,1.56,0.64,1);
  }
  .literacy-scale-labels {
    display: flex;
    justify-content: space-between;
    max-width: 480px;
    margin: 0 auto;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .literacy-level-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 20px;
  }
  .literacy-level-sub {
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 6px;
    line-height: 1.8;
  }

  /* Answers review */
  .review-section { margin-bottom: 32px; }
  .review-section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .review-item {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .review-item-num {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  
  .review-content-box {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.7;
      background: var(--paper);
      padding: 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      max-height: 140px;
      overflow-y: auto;
  }

  .review-headline-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 14px;
  }
  .review-headline-box {
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.7;
  }
  .review-headline-box.orig {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    color: var(--ink-muted);
  }
  .review-headline-box.better {
    background: var(--ok-soft);
    border-left: 3px solid var(--ok);
    color: var(--ink-muted);
  }
  .review-headline-box-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .review-headline-box.orig .review-headline-box-label { color: var(--accent); }
  .review-headline-box.better .review-headline-box-label { color: var(--ok); }

  .result-chosen-label {
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .result-chosen {
    font-size: 13px;
    color: var(--ink-muted);
    padding: 12px 14px;
    background: var(--paper-warm);
    border-radius: var(--radius);
    margin-bottom: 16px;
    line-height: 1.7;
    font-weight: 500;
    border-left: 3px solid var(--ink);
  }
  .result-icon-orig::before { content: '⚠️ '; color: var(--accent); }
  .result-icon-better::before { content: '✨ '; color: var(--ok); }
  .result-icon-distract::before { content: '❌ '; color: var(--ink-faint); }

  .review-why-box {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.8;
    margin-bottom: 10px;
    padding: 14px 16px;
    background: var(--gold-soft);
    border-radius: var(--radius);
  }
  
  .feedback-unesco {
    font-size: 13px;
    color: var(--ink-muted);
    border-left: 3px solid var(--gold);
    padding-left: 14px;
    line-height: 1.8;
    font-style: italic;
    margin-top: 12px;
  }
  .feedback-unesco strong { color: var(--ink); font-style: normal; }
  
  .review-source {
    margin-top: 16px;
  }
  .review-source a {
    font-size: 12px;
    color: var(--gold);
    text-decoration: none;
    word-break: break-all;
  }
  .review-source a:hover { text-decoration: underline; }

  /* Footer buttons */
  .results-footer {
    text-align: center;
    padding-top: 8px;
  }
  .btn-restart {
    display: inline-block;
    padding: 14px 40px;
    background: var(--accent);
    color: #fff;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-restart:hover { background: #6e1d28; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-fade { animation: fadeUp 0.4s ease both; }
  .anim-fade-2 { animation: fadeUp 0.4s 0.1s ease both; }
  .anim-fade-3 { animation: fadeUp 0.4s 0.2s ease both; }

  @media (max-width: 600px) {
    .quiz-header { padding: 12px 16px; }
    .quiz-header-title { font-size: 12px; }
    .quiz-body { padding: 24px 16px 60px; }
    .news-card { padding: 20px 18px; }
    .review-headline-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===== INTRO ===== -->
<div id="intro" class="screen active">
  <div class="intro-wrap">
    <div class="intro-eyebrow anim-fade">媒介素养测试 · Media Literacy Quiz</div>
    <h1 class="intro-title anim-fade-2">新闻标题里的<em>她</em></h1>
    <div class="intro-divider anim-fade-2"></div>
    <p class="intro-desc anim-fade-3">
      每一条新闻，都在用标题为女性定义形象。<br>
      但你是否已经习惯了那些隐蔽的“毒标题”？<br>
      <br>
      在此测试中，你需要阅读真实的原始新闻长段落，<br>并凭直觉找出那个<strong>真正被发布在现实中</strong>的新闻标题。<br>
      <span style="font-size: 13px; color: var(--accent);">注意：你越觉得某个标题“像真的”，可能意味着你受到的规训越深。</span>
    </p>
    <div class="intro-meta anim-fade-3">
      <div class="intro-meta-item">
        <span class="intro-meta-num">8</span>
        <span class="intro-meta-label">真实案例</span>
      </div>
      <div class="intro-meta-item">
        <span class="intro-meta-num">盲测</span>
        <span class="intro-meta-label">随时修改选择</span>
      </div>
      <div class="intro-meta-item">
        <span class="intro-meta-num">末尾</span>
        <span class="intro-meta-label">显示深度解析</span>
      </div>
    </div>
    <button class="btn-start" id="btnStart">接受挑战</button>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-header-title">新闻标题里的她</div>
    <div class="quiz-progress-wrap">
      <div class="quiz-progress-bar-bg">
        <div class="quiz-progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div class="quiz-progress-text" id="progressText">0 / 8</div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="quiz-card" id="quizCard">
      <!-- Question content will be injected here -->
    </div>
  </div>
</div>

<!-- ===== RESULTS ===== -->
<div id="results" class="screen">
  <div class="results-wrap">
    <div class="results-eyebrow">盲测评测报告</div>
    <h2 class="results-title" id="resultsTitle">测试完成</h2>

    <div class="score-ring-wrap">
      <svg class="score-ring-svg" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="66" fill="none" stroke="#e8e0d8" stroke-width="10"/>
        <circle id="scoreRingCircle" cx="80" cy="80" r="66" fill="none" stroke="#8b2635" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"
          transform="rotate(-90 80 80)" style="transition: stroke-dashoffset 1s ease;"/>
        <text x="80" y="74" text-anchor="middle" dominant-baseline="middle" class="score-ring-num" id="scoreNum">0/8</text>
        <text x="80" y="98" text-anchor="middle" class="score-ring-label" id="scoreRingLabel">命中真实（问题）标题</text>
      </svg>
    </div>

    <div class="literacy-bar-section">
      <div class="literacy-bar-title">媒介生态影响评估</div>
      <div class="literacy-bar-desc" id="literacyDesc">正在计算……</div>
      <div class="literacy-spectrum">
        <div class="literacy-marker" id="literacyMarker" style="left: 0%"></div>
      </div>
      <div class="literacy-scale-labels">
        <span>拒绝问题叙事 (素养高)</span>
        <span>部分接受</span>
        <span>深陷问题叙事</span>
      </div>
      <div class="literacy-level-text" id="literacyLevel">—</div>
      <div class="literacy-level-sub" id="literacyLevelSub">—</div>
    </div>

    <div class="review-section">
      <div class="review-section-title">全景案例解析与 UNESCO 准则对照</div>
      <div id="reviewList"></div>
    </div>

    <div class="results-footer">
      <button class="btn-restart" id="btnRestart">重新挑战</button>
    </div>
  </div>
</div>

<script>
(function() {
  // 原封不动还原真实文档素材内容，严格遵循避免“受害者做主语”的指导原则
  var QUESTIONS = [
    {
      tag: "第 1 题 · 性别标注",
      source: "福建清流县公安局悬赏通告",

      why: "【极致反差】和【甜妹】将女性军人的外貌作为新闻首要噱头，暗示甜美女孩会打枪才是新闻价值所在，而非她的专业能力本身。这种叙事恰恰加剧了对女性军人的刻板印象。",
      unescoCite: "对女性专业人员的报道应聚焦其专业成就，不应以外貌特征（甜美、美丽）作为描述前提或核心标签，男性同行在相似报道中不会受到同等待遇。",

    {

      origTitle: "韦东奕连听3天讲座，这位女教授该有多厉害？",
      betterTitle: "数学家王虹北大连开三日讲座，破解三维挂谷猜想引广泛关注",
      distractor: "数学家王虹北大讲座连续三日座无虚席，韦东奕现身第一排",
      why: "标题以男性名人（韦东奕）作为主语和评判标尺，将女性科学家的成就依附于男性的认可。“该有多厉害”的惊叹语气也暗含了“女性数学家通常不厉害”的系统性预设偏见。",
      unescoCite: "报道女性专业人士时，应以其本人成就为核心，而非通过他人（尤其是男性）的反应来佐证其价值。避免使女性的成就依赖外部（男性）的认证。",

  ];

  var currentQ = 0;
  var userSelections = new Array(QUESTIONS.length).fill(null);
  var shuffledQuestionsOpts = new Array(QUESTIONS.length).fill(null);

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function startQuiz() {
    currentQ = 0;
    userSelections = new Array(QUESTIONS.length).fill(null);
    shuffledQuestionsOpts = new Array(QUESTIONS.length).fill(null);
    showScreen('quiz');
    renderQuestion();
  }

  function shuffleOptions(q) {
    var opts = [
      { text: q.origTitle, type: 'orig' },
      { text: q.betterTitle, type: 'better' },
      { text: q.distractor, type: 'distractor' }
    ];
    for (var i = opts.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
    }
    return opts;
  }

  function renderQuestion() {
    var q = QUESTIONS[currentQ];
    var pct = (currentQ / QUESTIONS.length) * 100;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = (currentQ + 1) + ' / ' + QUESTIONS.length;

    if (!shuffledQuestionsOpts[currentQ]) {
      shuffledQuestionsOpts[currentQ] = shuffleOptions(q);
    }
    var currentOpts = shuffledQuestionsOpts[currentQ];
    var savedSelection = userSelections[currentQ];

    var letters = ['A', 'B', 'C'];
    var optionsHtml = currentOpts.map(function(opt, i) {
      var isSelected = (savedSelection && savedSelection.text === opt.text) ? ' selected' : '';
      return '<button class="option-btn' + isSelected + '" data-idx="' + i + '" id="opt_' + i + '">'
        + '<span class="option-letter">' + letters[i] + '</span>' + opt.text + '</button>';
    }).join('');

    var isLast = currentQ >= QUESTIONS.length - 1;
    var btnPrevHtml = '<button class="btn-nav btn-prev ' + (currentQ === 0 ? 'hidden' : '') + '" id="btnPrev">← 上一题</button>';
    var btnNextState = savedSelection ? '' : 'disabled';
    var btnNextText = isLast ? '提交并查看报告' : '下一题 →';
    var btnNextHtml = '<button class="btn-nav btn-next" id="btnNext" ' + btnNextState + '>' + btnNextText + '</button>';

    document.getElementById('quizCard').innerHTML =
      '<div class="anim-fade">'
      + '<div class="quiz-q-label">' + q.tag + '</div>'
      + '<div class="quiz-q-task">请凭直觉选出，以下哪个是真实发布在媒体上的新闻标题？</div>'
      + '<div class="quiz-q-sub">（注意：寻找那个现实中“真正存在”的标题）</div>'
      + '<div class="news-card">'
      + '<div class="news-card-source">原始事件长文本素材</div>'
      + '<div class="news-card-body">' + q.content + '</div>'
      + '</div>'
      + '<div class="options-list">' + optionsHtml + '</div>'
      + '<div class="quiz-nav">' + btnPrevHtml + btnNextHtml + '</div>'
      + '</div>';
  }

  function selectOption(idx) {
    var chosenOpt = shuffledQuestionsOpts[currentQ][idx];
    userSelections[currentQ] = chosenOpt;

    var buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(function(btn) { btn.classList.remove('selected'); });
    document.getElementById('opt_' + idx).classList.add('selected');

    document.getElementById('btnNext').removeAttribute('disabled');

    setTimeout(function() {
      if (userSelections[currentQ] && userSelections[currentQ].text === chosenOpt.text) {
          goNext();
      }
    }, 400);
  }

  function goNext() {
    if (!userSelections[currentQ]) return;
    if (currentQ >= QUESTIONS.length - 1) {
      showResults();
    } else {
      currentQ++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function goPrev() {
    if (currentQ > 0) {
      currentQ--;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function showResults() {
    showScreen('results');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    var realCount = userSelections.filter(function(a) { return a && a.type === 'orig'; }).length;
    var total = QUESTIONS.length;
    var pct = realCount / total;

    var circum = 414.7;
    document.getElementById('scoreNum').textContent = realCount + '/' + total;
    setTimeout(function() {
      document.getElementById('scoreRingCircle').style.strokeDashoffset = circum * (1 - pct);
    }, 300);

    var markerLeft = Math.round(pct * 100);
    setTimeout(function() {
      document.getElementById('literacyMarker').style.left = markerLeft + '%';
    }, 600);

    var level, sub, desc;
    if (realCount >= 6) {
      level = "深度内化问题叙事";
      desc = "你准确识别出了 " + realCount + " / " + total + " 个真实的标题。这说明你对当前的恶劣媒介生态极为熟悉。";
      sub = "潜意识里，你可能已经接受了‘新闻标题本来就该这么写’。高命中率恰恰证明了问题叙事对你的规训有多深。";
    } else if (realCount >= 4) {
      level = "习惯性接受问题叙事";
      desc = "你认出了 " + realCount + " / " + total + " 个真实的标题。这些充满偏见的套路对你来说并不陌生。";
      sub = "这很正常，我们都在被这样的信息环境包围。意识到恶劣框架的存在，是夺回认知主权的第一步。";
    } else if (realCount >= 2) {
      level = "具备一定的媒介免疫力";
      desc = "你只猜中了 " + realCount + " / " + total + " 个真实的标题。面对偏见叙事，你保留了一定的审视距离。";
      sub = "你没有完全被标题党俘获，往往能察觉到叙事中的不合理之处，继续保持你的批判性思考。";
    } else {
      level = "媒介素养极高";
      desc = "你几乎避开了所有真实的毒标题！在你眼中，客观、公正、尊重人权的叙事才是理所应当的。";
      sub = "你完全没有受到污浊媒介环境的规训，你所选择的答案，恰恰是这个世界本该有的正确模样。";
    }

    document.getElementById('resultsTitle').textContent =
      realCount <= 3 ? "你拥有一双清澈的眼睛" : "你在多大程度上向现实妥协了？";
    document.getElementById('literacyLevel').textContent = level;
    document.getElementById('literacyLevelSub').textContent = sub;
    document.getElementById('literacyDesc').textContent = desc;

    var reviewHtml = QUESTIONS.map(function(q, i) {
      var a = userSelections[i];
      if (!a) return ''; 
      
      var isBetter = a.type === 'better';
      var isReal = a.type === 'orig';

      var statusColor = isBetter ? 'var(--ok)' : (isReal ? 'var(--accent)' : 'var(--ink-faint)');
      var statusText = isBetter ? '✨ 选中最优改良标题' : (isReal ? '⚠️ 选中现实问题标题' : '❌ 选中干扰项');
      var chosenClass = isBetter ? 'result-icon-better' : (isReal ? 'result-icon-orig' : 'result-icon-distract');

      var chosenHtml = '<div class="result-chosen-label">你当时的选择：</div><div class="result-chosen ' + chosenClass + '">' + a.text + '</div>';

      return '<div class="review-item">'
        + '<div class="review-item-num">题目 ' + (i+1) + ' · ' + q.source
        + ' <span style="margin-left:8px;font-weight:700;color:' + statusColor + '">' + statusText + '</span></div>'
        + '<div class="review-content-box">' + q.content + '</div>'
        + chosenHtml
        + '<div class="review-headline-row">'
        + '<div class="review-headline-box orig"><div class="review-headline-box-label">⚠️ 现实原始问题标题</div>' + q.origTitle + '</div>'
        + '<div class="review-headline-box better"><div class="review-headline-box-label">✨ 更符合新闻伦理的标题</div>' + q.betterTitle + '</div>'
        + '</div>'
        + '<div class="review-why-box"><strong style="color:var(--ink)">媒介滤镜剖析：</strong>' + q.why + '</div>'
        + '<div class="feedback-unesco"><strong>UNESCO准则：</strong>' + q.unescoCite + '</div>'
        + '<div class="review-source">原文来源：<a href="' + q.source_url + '" target="_blank">' + q.source_url + '</a></div>'
        + '</div>';
    }).join('');
    document.getElementById('reviewList').innerHTML = reviewHtml;
  }

  // 绑定事件
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('btnStart').addEventListener('click', startQuiz);
    document.getElementById('btnRestart').addEventListener('click', startQuiz);
    
    document.getElementById('quiz').addEventListener('click', function(e) {
      var optBtn = e.target.closest('.option-btn');
      if (optBtn) {
        var idx = parseInt(optBtn.getAttribute('data-idx'), 10);
        if (!isNaN(idx)) selectOption(idx);
        return;
      }
      var nextBtn = e.target.closest('#btnNext');
      if (nextBtn && !nextBtn.disabled) goNext();
      
      var prevBtn = e.target.closest('#btnPrev');
      if (prevBtn) goPrev();
    });
  });
})();
</script>
</body>
</html>
